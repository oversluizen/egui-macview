[package]
name = "egui-macview"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
authors = ["Jaco Hoving", "Patrix UI & Rendering Team"]
description = "Deterministic macOS AppKit Layout Engine, Authentic Control Primitive Suite, and CoreAnimation Physics Runtime for egui."
readme = "README.md"
keywords = ["egui", "macos", "appkit", "gui", "layout"]
categories = ["gui"]

[dependencies]
egui = { version = "0.37.0", default-features = false }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[dev-dependencies]
image = "0.25"
proptest = "1.6"
