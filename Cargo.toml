[package]
name = "egui-macview"
version = "0.6.6"
edition = "2021"
license = "MIT OR Apache-2.0"
authors = ["Jaco Oversluizen", "egui-macview contributors"]
description = "Cross-platform macOS AppKit Layout Engine, Authentic Control Primitive Suite, and CoreAnimation Physics Runtime for egui on Windows 11, macOS, Linux, and Web."
repository = "https://github.com/oversluizen/egui-macview"
documentation = "https://docs.rs/egui-macview"
readme = "README.md"
keywords = ["egui", "appkit", "windows-11", "cross-platform", "macos"]
categories = ["gui", "rendering"]
autotests = false

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[dependencies]
egui = { version = "0.37.0", default-features = false }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[dev-dependencies]
eframe = { version = "0.37.0", features = ["glow", "wgpu"] }
image = "0.25"
proptest = "1.6"

